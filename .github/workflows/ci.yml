name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-only-secret-used-for-build-verification-2026
      APP_URL: https://example.invalid

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client for typecheck
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Diff check
        run: |
          git fetch origin main --depth=1
          git diff --check origin/main HEAD

      - name: Prepare isolated checkout database
        run: npx prisma db push --skip-generate

      - name: Run checkout concurrency integration
        env:
          NODE_ENV: test
          RUN_CHECKOUT_INTEGRATION: '1'
          TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?connection_limit=10
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types --test tests/checkout-concurrency.integration.test.ts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
